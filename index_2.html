<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace UGC — Console</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16181D; --panel:#1E2128; --panel2:#242832; --rail:#2E323C;
  --ugc:#E8833A; --asc:#4EA8C7; --side:#A8B57C;
  --pos:#5FBF8F; --neg:#D9645E; --master:#F0C24B;
  --tx:#ECEEF2; --mut:#8A91A0;
  --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Inter,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}
.cond{font-family:'Barlow Condensed',sans-serif;letter-spacing:.04em}

/* ---------- Login ---------- */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gatecard{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--rail);border-radius:10px;padding:32px}
.gatemark{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.gatedot{width:9px;height:9px;border-radius:50%;background:var(--ugc);box-shadow:0 0 10px var(--ugc)}
.gatetitle{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.09em}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin-bottom:7px;font-weight:600}
input{width:100%;background:var(--bg);border:1px solid var(--rail);color:var(--tx);border-radius:var(--r);padding:11px 13px;font-size:14px;font-family:Inter,sans-serif;outline:none;margin-bottom:16px}
input:focus{border-color:var(--ugc)}
button.primary{width:100%;background:var(--ugc);color:#16181D;border:none;border-radius:var(--r);padding:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:Inter,sans-serif}
button.primary:hover{filter:brightness(1.08)}
button.primary:disabled{opacity:.5;cursor:default}
.err{color:var(--neg);font-size:13px;margin-top:12px;min-height:18px;line-height:1.45}
.hint{color:var(--mut);font-size:12px;margin-top:16px;line-height:1.5}

/* ---------- Shell ---------- */
#app{display:none}
header{border-bottom:1px solid var(--rail);background:var(--panel);position:sticky;top:0;z-index:20}
.hwrap{max-width:1240px;margin:0 auto;padding:0 22px;height:60px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:9px;font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;white-space:nowrap}
.spacer{flex:1}
select{background:var(--bg);border:1px solid var(--rail);color:var(--tx);border-radius:var(--r);padding:8px 11px;font-size:13px;font-family:Inter,sans-serif;outline:none;cursor:pointer}
.signout{background:none;border:1px solid var(--rail);color:var(--mut);border-radius:var(--r);padding:8px 13px;font-size:12px;cursor:pointer;font-family:Inter,sans-serif;white-space:nowrap}
.signout:hover{color:var(--tx);border-color:var(--mut)}
main{max-width:1240px;margin:0 auto;padding:26px 22px 70px}

/* ---------- Channel strips ---------- */
.console{display:grid;grid-template-columns:repeat(3,1fr) 1.25fr;gap:14px;margin-bottom:14px}
.strip{background:var(--panel);border:1px solid var(--rail);border-radius:10px;padding:16px 15px;display:flex;flex-direction:column;min-height:212px}
.strip.master{background:var(--panel2)}
.striplabel{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);display:flex;align-items:center;gap:7px}
.chdot{width:7px;height:7px;border-radius:50%;flex:none}
.stripval{font-family:'JetBrains Mono',monospace;font-size:25px;font-weight:700;margin-top:auto;letter-spacing:-.02em}
.stripsub{font-size:11.5px;color:var(--mut);margin-top:5px}
.meter{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:13px}
.meterfill{height:100%;border-radius:3px;transition:width .5s ease}
.mrow{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);padding:5px 0;border-bottom:1px solid var(--rail)}
.mrow:last-child{border-bottom:none}
.mrow b{font-family:'JetBrains Mono',monospace;color:var(--tx);font-weight:500}
.mrow b.pos{color:var(--pos)} .mrow b.neg{color:var(--neg)}

/* ---------- Tabs ---------- */
nav.tabs{display:flex;gap:3px;border-bottom:1px solid var(--rail);margin:26px 0 20px;overflow-x:auto}
nav.tabs button{background:none;border:none;color:var(--mut);padding:10px 15px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;font-family:Inter,sans-serif;white-space:nowrap}
nav.tabs button:hover{color:var(--tx)}
nav.tabs button.on{color:var(--tx);border-bottom-color:var(--ugc)}

/* ---------- Panels / tables ---------- */
.card{background:var(--panel);border:1px solid var(--rail);border-radius:10px;padding:19px;margin-bottom:15px}
.cardtitle{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.cardsub{font-size:12.5px;color:var(--mut);margin-bottom:15px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);padding:8px 9px;border-bottom:1px solid var(--rail);font-weight:600}
td{padding:10px 9px;border-bottom:1px solid var(--rail)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:'JetBrains Mono',monospace}
td.pos{color:var(--pos)} td.neg{color:var(--neg)}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:99px;border:1px solid var(--rail);color:var(--mut)}
.empty{color:var(--mut);font-size:13px;padding:26px 0;text-align:center}
.bar{height:4px;border-radius:2px;background:var(--rail);overflow:hidden;margin-top:5px}
.barfill{height:100%;border-radius:2px}
.loading{color:var(--mut);font-size:13px;padding:50px 0;text-align:center}
@media(max-width:860px){.console{grid-template-columns:1fr 1fr}.hwrap{gap:10px}}
@media(max-width:520px){.console{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="gate">
  <div class="gatecard">
    <div class="gatemark"><span class="gatedot"></span><span class="gatetitle">Trace UGC</span></div>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="email" placeholder="you@example.com">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="primary" id="signin">Sign in</button>
    <div class="err" id="gateerr"></div>
    <div class="hint" id="gatehint">Private dashboard. Data syncs from your Discord bot.</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <header>
    <div class="hwrap">
      <div class="brand"><span class="gatedot"></span>Trace UGC</div>
      <div class="spacer"></div>
      <select id="period">
        <option value="mtd">This month</option>
        <option value="last">Last month</option>
        <option value="ytd" selected>This year</option>
        <option value="all">All time</option>
      </select>
      <button class="signout" id="signout">Sign out</button>
    </div>
  </header>

  <main>
    <div id="loading" class="loading">Loading your data…</div>
    <div id="content" style="display:none">

      <div class="console">
        <div class="strip">
          <div class="striplabel"><span class="chdot" style="background:var(--ugc)"></span>TraceUGC</div>
          <div class="stripval" id="v-ugc">$0</div>
          <div class="stripsub" id="s-ugc">—</div>
          <div class="meter"><div class="meterfill" id="m-ugc" style="background:var(--ugc);width:0%"></div></div>
        </div>
        <div class="strip">
          <div class="striplabel"><span class="chdot" style="background:var(--asc)"></span>Ascension</div>
          <div class="stripval" id="v-asc">$0</div>
          <div class="stripsub" id="s-asc">—</div>
          <div class="meter"><div class="meterfill" id="m-asc" style="background:var(--asc);width:0%"></div></div>
        </div>
        <div class="strip">
          <div class="striplabel"><span class="chdot" style="background:var(--side)"></span>Side jobs</div>
          <div class="stripval" id="v-side">$0</div>
          <div class="stripsub" id="s-side">—</div>
          <div class="meter"><div class="meterfill" id="m-side" style="background:var(--side);width:0%"></div></div>
        </div>
        <div class="strip master">
          <div class="striplabel"><span class="chdot" style="background:var(--master)"></span>Master</div>
          <div class="stripval" id="v-net" style="color:var(--master)">$0</div>
          <div class="stripsub">Net after costs</div>
          <div style="margin-top:13px">
            <div class="mrow"><span>Revenue in</span><b id="v-rev">$0</b></div>
            <div class="mrow"><span>Editor payroll</span><b id="v-pay" class="neg">$0</b></div>
            <div class="mrow"><span>Expenses</span><b id="v-exp" class="neg">$0</b></div>
            <div class="mrow"><span>Ascension MRR</span><b id="v-mrr">$0/mo</b></div>
          </div>
        </div>
      </div>

      <nav class="tabs">
        <button class="on" data-t="revenue">Revenue</button>
        <button data-t="clients">Client profitability</button>
        <button data-t="week">Weekly report</button>
        <button data-t="payroll">Payroll</button>
        <button data-t="expenses">Expenses</button>
        <button data-t="invoices">Invoices</button>
        <button data-t="mrr">Recurring</button>
      </nav>

      <div id="tab-revenue"></div>
      <div id="tab-clients" style="display:none"></div>
      <div id="tab-week" style="display:none"></div>
      <div id="tab-payroll" style="display:none"></div>
      <div id="tab-expenses" style="display:none"></div>
      <div id="tab-invoices" style="display:none"></div>
      <div id="tab-mrr" style="display:none"></div>

    </div>
  </main>
</div>

<script>
/* ============================================================
   Project URL is fixed. The publishable key is entered once in
   the browser on first open and remembered on this device.
   That key is safe to hold client-side: every table has row-level
   security, so it can read nothing without a valid login.
   ============================================================ */
const SUPABASE_URL = 'https://kvtjsqrywgelxceaoaax.supabase.co';
let SUPABASE_KEY = localStorage.getItem('tugc_key') || '';

let sb = SUPABASE_KEY ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const $ = id => document.getElementById(id);
const money = n => '$' + (Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => '$' + Math.round(Number(n)||0).toLocaleString();
let DATA = {};

/* ---------------- one-time key setup ---------------- */
function showSetup(){
  $('em').style.display = 'none'; $('pw').style.display = 'none';
  document.querySelectorAll('label').forEach(l => l.style.display = 'none');
  const box = document.createElement('div');
  box.innerHTML = `<label style="display:block">Publishable key</label>
    <input id="keyin" type="text" placeholder="sb_publishable_…" autocomplete="off">`;
  $('signin').parentNode.insertBefore(box, $('signin'));
  $('signin').textContent = 'Save key';
  $('gatehint').innerHTML = 'One-time setup. In Supabase open <b>Settings → API Keys</b> and copy the <b>Publishable key</b>. It is stored on this device only.';
  $('signin').onclick = () => {
    const k = $('keyin').value.trim();
    if (!k.startsWith('sb_publishable_')) { $('gateerr').textContent = 'That does not look like a publishable key — it should start with sb_publishable_'; return; }
    localStorage.setItem('tugc_key', k);
    location.reload();
  };
}

/* ---------------- auth ---------------- */
function wireLogin(){
  $('signin').onclick = async () => {
    const btn = $('signin'); const err = $('gateerr');
    err.textContent = '';
    btn.disabled = true; btn.textContent = 'Signing in…';
    const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
    btn.disabled = false; btn.textContent = 'Sign in';
    if (error) { err.textContent = error.message; return; }
    start();
  };
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('signin').click(); });
  $('em').addEventListener('keydown', e => { if (e.key === 'Enter') $('pw').focus(); });
  $('signout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  sb.auth.getSession().then(({ data }) => { if (data.session) start(); });
}

if (!sb) showSetup(); else wireLogin();

async function start(){
  $('gate').style.display = 'none';
  $('app').style.display = 'block';
  await loadAll();
  $('period').onchange = render;
  document.querySelectorAll('nav.tabs button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('nav.tabs button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      ['revenue','clients','week','payroll','expenses','invoices','mrr'].forEach(t => {
        $('tab-'+t).style.display = (t === b.dataset.t) ? 'block' : 'none';
      });
    };
  });
}

/* ---------------- data ---------------- */
async function loadAll(){
  const tables = ['ugc_income','ascension_income','side_income','payroll','expenses','mrr_clients','invoices','videos'];
  const out = {};
  for (const t of tables){
    const { data, error } = await sb.from(t).select('*');
    out[t] = error ? [] : (data || []);
  }
  DATA = out;
  $('loading').style.display = 'none';
  $('content').style.display = 'block';
  render();
}

function inPeriod(iso){
  const p = $('period').value;
  if (p === 'all') return true;
  if (!iso) return false;
  const d = new Date(iso); if (isNaN(d)) return false;
  const now = new Date();
  if (p === 'ytd') return d.getFullYear() === now.getFullYear();
  if (p === 'mtd') return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  if (p === 'last'){
    const lm = new Date(now.getFullYear(), now.getMonth()-1, 1);
    return d.getFullYear() === lm.getFullYear() && d.getMonth() === lm.getMonth();
  }
  return true;
}
const sum = (rows, f) => rows.reduce((s,r) => s + (Number(f ? f(r) : r.amount) || 0), 0);
const filt = rows => rows.filter(r => inPeriod(r.logged_at || r.created_at || r.added_at));

/* attribute a payroll row to a business by video-count ratio */
function split(r){
  const a = Number(r.ascension_videos||0), t = Number(r.traceugc_videos||0), amt = Number(r.amount||0);
  if (t > 0 && a === 0) return { ugc: amt, asc: 0, untagged: 0 };
  if (a > 0 && t === 0) return { ugc: 0, asc: amt, untagged: 0 };
  if (a > 0 && t > 0) return { ugc: amt*(t/(a+t)), asc: amt*(a/(a+t)), untagged: 0 };
  return { ugc: 0, asc: 0, untagged: amt };
}

/* ---------------- render ---------------- */
function render(){
  const ugcInc = filt(DATA.ugc_income), ascInc = filt(DATA.ascension_income), sideInc = filt(DATA.side_income);
  const pay = filt(DATA.payroll), exp = filt(DATA.expenses);

  const uT = sum(ugcInc), aT = sum(ascInc), sT = sum(sideInc);
  const rev = uT + aT + sT;
  const payT = sum(pay), expT = sum(exp);
  const mrrT = sum(DATA.mrr_clients);
  const net = rev - payT - expT;
  const peak = Math.max(uT, aT, sT, 1);

  $('v-ugc').textContent = money0(uT);
  $('v-asc').textContent = money0(aT);
  $('v-side').textContent = money0(sT);
  $('s-ugc').textContent = ugcInc.length + ' payment' + (ugcInc.length===1?'':'s');
  $('s-asc').textContent = ascInc.length + ' payment' + (ascInc.length===1?'':'s');
  $('s-side').textContent = sideInc.length + ' payment' + (sideInc.length===1?'':'s');
  $('m-ugc').style.width = (uT/peak*100) + '%';
  $('m-asc').style.width = (aT/peak*100) + '%';
  $('m-side').style.width = (sT/peak*100) + '%';
  $('v-rev').textContent = money0(rev);
  $('v-pay').textContent = '−' + money0(payT);
  $('v-exp').textContent = '−' + money0(expT);
  $('v-mrr').textContent = money0(mrrT) + '/mo';
  const netEl = $('v-net');
  netEl.textContent = money0(net);
  netEl.style.color = net >= 0 ? 'var(--master)' : 'var(--neg)';

  renderRevenue(ugcInc, ascInc, sideInc, uT, aT, sT, rev);
  renderClients(ugcInc, ascInc, pay);
  renderWeek();
  renderPayroll(pay);
  renderExpenses(exp);
  renderInvoices();
  renderMrr(mrrT);
}

function renderRevenue(ugcInc, ascInc, sideInc, uT, aT, sT, rev){
  const tagged = [
    ...ugcInc.map(r => ({ name: r.company, amount: Number(r.amount)||0, month: r.month, when: r.logged_at, stream: 'TraceUGC', note: r.note })),
    ...ascInc.map(r => ({ name: r.company, amount: Number(r.amount)||0, month: r.month, when: r.logged_at, stream: 'Ascension', note: r.note })),
    ...sideInc.map(r => ({ name: r.source, amount: Number(r.amount)||0, month: null, when: r.logged_at, stream: 'Side job', note: r.note })),
  ].sort((a,b) => new Date(b.when||0) - new Date(a.when||0));

  const pct = v => rev > 0 ? (v/rev*100) : 0;
  const colorOf = s => s === 'TraceUGC' ? 'var(--ugc)' : s === 'Ascension' ? 'var(--asc)' : 'var(--side)';

  // month-by-month across the selected period
  const byMonth = {};
  tagged.forEach(r => {
    const d = new Date(r.when);
    const key = isNaN(d) ? (r.month || 'Unknown') : (MONTHS[d.getMonth()] + ' ' + d.getFullYear());
    if (!byMonth[key]) byMonth[key] = { total:0, ugc:0, asc:0, side:0, sort: isNaN(d) ? 0 : d.getTime() };
    byMonth[key].total += r.amount;
    if (r.stream === 'TraceUGC') byMonth[key].ugc += r.amount;
    else if (r.stream === 'Ascension') byMonth[key].asc += r.amount;
    else byMonth[key].side += r.amount;
  });
  const months = Object.entries(byMonth).sort((a,b) => a[1].sort - b[1].sort);
  const peak = Math.max(...months.map(m => m[1].total), 1);

  const monthRows = months.map(([k,v]) => `
    <tr>
      <td>${esc(k)}
        <div style="display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--rail);margin-top:6px;width:${Math.max(6, v.total/peak*100)}%">
          <div style="width:${v.total?v.ugc/v.total*100:0}%;background:var(--ugc)"></div>
          <div style="width:${v.total?v.asc/v.total*100:0}%;background:var(--asc)"></div>
          <div style="width:${v.total?v.side/v.total*100:0}%;background:var(--side)"></div>
        </div>
      </td>
      <td class="num" style="color:var(--ugc)">${v.ugc?money0(v.ugc):'—'}</td>
      <td class="num" style="color:var(--asc)">${v.asc?money0(v.asc):'—'}</td>
      <td class="num" style="color:var(--side)">${v.side?money0(v.side):'—'}</td>
      <td class="num"><b>${money(v.total)}</b></td>
    </tr>`).join('');

  const entryRows = tagged.slice(0, 60).map(r => `
    <tr>
      <td>${esc(r.name||'—')}${r.note?`<div style="color:var(--mut);font-size:11.5px;margin-top:2px">${esc(r.note)}</div>`:''}</td>
      <td><span class="tag" style="color:${colorOf(r.stream)};border-color:${colorOf(r.stream)}">${r.stream}</span></td>
      <td style="color:var(--mut)">${esc(r.month || (r.when ? new Date(r.when).toISOString().slice(0,10) : ''))}</td>
      <td class="num pos">${money(r.amount)}</td>
    </tr>`).join('');

  $('tab-revenue').innerHTML = `
    <div class="card">
      <div class="cardtitle">Revenue by stream</div>
      <div class="cardsub">Everything that came in during the selected period.</div>
      <div style="display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--rail);margin-bottom:15px">
        <div style="width:${pct(uT)}%;background:var(--ugc)"></div>
        <div style="width:${pct(aT)}%;background:var(--asc)"></div>
        <div style="width:${pct(sT)}%;background:var(--side)"></div>
      </div>
      <table><tbody>
        <tr><td><span class="chdot" style="background:var(--ugc);display:inline-block;margin-right:7px"></span>TraceUGC</td><td class="num" style="color:var(--mut)">${pct(uT).toFixed(0)}%</td><td class="num">${money(uT)}</td></tr>
        <tr><td><span class="chdot" style="background:var(--asc);display:inline-block;margin-right:7px"></span>Ascension Media</td><td class="num" style="color:var(--mut)">${pct(aT).toFixed(0)}%</td><td class="num">${money(aT)}</td></tr>
        <tr><td><span class="chdot" style="background:var(--side);display:inline-block;margin-right:7px"></span>Side jobs</td><td class="num" style="color:var(--mut)">${pct(sT).toFixed(0)}%</td><td class="num">${money(sT)}</td></tr>
        <tr><td><b>Total</b></td><td></td><td class="num pos"><b>${money(rev)}</b></td></tr>
      </tbody></table>
    </div>

    ${months.length ? `<div class="card">
      <div class="cardtitle">By month</div>
      <div class="cardsub">Bar length is that month's total; colours show the split between streams.</div>
      <table><thead><tr><th>Month</th><th class="num">TraceUGC</th><th class="num">Ascension</th><th class="num">Side</th><th class="num">Total</th></tr></thead><tbody>${monthRows}</tbody></table>
    </div>` : ''}

    <div class="card">
      <div class="cardtitle">All payments</div>
      <div class="cardsub">${tagged.length} payment${tagged.length===1?'':'s'} in this period${tagged.length>60?' · showing the 60 most recent':''}.</div>
      ${tagged.length ? `<table><thead><tr><th>From</th><th>Stream</th><th>When</th><th class="num">Amount</th></tr></thead><tbody>${entryRows}</tbody></table>` : `<div class="empty">No revenue logged in this period.</div>`}
    </div>`;
}

function renderClients(ugcInc, ascInc, pay){
  // revenue per client
  const map = {};
  const add = (name, amt, stream) => {
    const k = (name||'Unknown').trim().toLowerCase();
    if (!map[k]) map[k] = { name: (name||'Unknown').trim(), rev:0, stream, videos:0, cost:0 };
    map[k].rev += Number(amt)||0;
  };
  ugcInc.forEach(r => add(r.company, r.amount, 'TraceUGC'));
  ascInc.forEach(r => add(r.company, r.amount, 'Ascension'));

  // Editing cost = videos for that client x your per-video rate, unless you've
  // ticked off "Pay editor" or typed a manual override for either number.
  const rate = Number(localStorage.getItem('tugc_rate') || 12);
  const readMap = k => { try { return JSON.parse(localStorage.getItem(k) || '{}'); } catch(e) { return {}; } };
  let noCost = [];
  try { noCost = JSON.parse(localStorage.getItem('tugc_nocost') || '[]'); } catch(e) { noCost = []; }
  const vidOv = readMap('tugc_vidov');
  const costOv = readMap('tugc_costov');
  const isFree = k => noCost.includes(k);

  const vids = DATA.videos || [];
  vids.forEach(v => {
    const k = (v.client||'').trim().toLowerCase(); if (!k) return;
    if (!map[k]) map[k] = { name: (v.client||'').trim(), rev:0, stream:'—', videos:0, cost:0 };
    map[k].videos += 1;
  });
  // any client that only exists as an override still deserves a row
  Object.keys(vidOv).forEach(k => { if (!map[k]) map[k] = { name: k, rev:0, stream:'—', videos:0, cost:0 }; });

  Object.keys(map).forEach(k => {
    map[k].key = k;
    map[k].logged = map[k].videos;
    if (vidOv[k] != null) map[k].videos = Number(vidOv[k]) || 0;
    if (costOv[k] != null) map[k].cost = Number(costOv[k]) || 0;
    else map[k].cost = isFree(k) ? 0 : map[k].videos * rate;
  });

  const rows = Object.values(map).map(r => ({...r, profit: r.rev - r.cost}))
    .filter(r => r.rev > 0 || r.videos > 0)
    .sort((a,b) => b.profit - a.profit);

  const totRev = rows.reduce((s,r)=>s+r.rev,0);
  const totCost = rows.reduce((s,r)=>s+r.cost,0);
  const totVids = rows.reduce((s,r)=>s+r.videos,0);
  const best = Math.max(...rows.map(r => Math.abs(r.profit)), 1);
  const inputStyle = 'width:82px;margin:0;padding:5px 7px;font-size:12.5px;text-align:right;font-family:JetBrains Mono,monospace';
  const body = rows.length ? rows.map(r => `
    <tr>
      <td>${esc(r.name)}<div class="bar"><div class="barfill" style="width:${Math.abs(r.profit)/best*100}%;background:${r.profit>=0?'var(--pos)':'var(--neg)'}"></div></div></td>
      <td><span class="tag">${r.stream}</span></td>
      <td style="text-align:center"><input type="checkbox" class="paychk" data-k="${esc(r.key)}" ${isFree(r.key)?'':'checked'} style="width:auto;margin:0;cursor:pointer" title="Untick if you don't pay an editor for this client"></td>
      <td class="num"><input type="number" class="vidov" data-k="${esc(r.key)}" value="${r.videos}" style="${inputStyle}" title="${r.logged} logged from Discord — type to override"></td>
      <td class="num">${money(r.rev)}</td>
      <td class="num"><input type="number" step="0.01" class="costov" data-k="${esc(r.key)}" value="${r.cost.toFixed(2)}" style="${inputStyle};color:${costOv[r.key]!=null?'var(--master)':'var(--tx)'}" title="Auto = videos × rate. Type to override."></td>
      <td class="num ${r.profit>=0?'pos':'neg'}">${money(r.profit)}</td>
    </tr>`).join('') : '';

  $('tab-clients').innerHTML = `
    <div class="card">
      <div class="cardtitle">Client profitability</div>
      <div class="cardsub">Editing cost defaults to videos × your rate. Untick <b>Pay editor</b> for clients you handle yourself, or type straight into the <b>Videos</b> / <b>Editing cost</b> boxes to override. Gold figures are manual overrides.</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
        <label style="margin:0">Rate per video</label>
        <input id="rateInput" type="number" step="0.01" value="${rate}" style="width:110px;margin:0">
        <button class="signout" id="rateSave">Apply</button>
        <button class="signout" id="ovReset">Clear all overrides</button>
      </div>
      ${rows.length ? `<table><thead><tr><th>Client</th><th>Stream</th><th style="text-align:center">Pay editor</th><th class="num">Videos</th><th class="num">Revenue</th><th class="num">Editing cost</th><th class="num">Profit</th></tr></thead><tbody>${body}</tbody>
        <tfoot><tr><td colspan="3"><b>Total</b></td><td class="num"><b>${totVids}</b></td><td class="num"><b>${money(totRev)}</b></td><td class="num"><b>−${money(totCost)}</b></td><td class="num ${totRev-totCost>=0?'pos':'neg'}"><b>${money(totRev-totCost)}</b></td></tr></tfoot></table>`
        : `<div class="empty">No client revenue or videos in this period yet.</div>`}
    </div>`;

  const btn = $('rateSave');
  if (btn) btn.onclick = () => {
    const v = Number($('rateInput').value);
    if (!isFinite(v) || v < 0) return;
    localStorage.setItem('tugc_rate', String(v));
    render();
  };
  const reset = $('ovReset');
  if (reset) reset.onclick = () => {
    if (!confirm('Clear every manual video and cost override? Rate and Pay-editor ticks stay.')) return;
    localStorage.removeItem('tugc_vidov');
    localStorage.removeItem('tugc_costov');
    render();
  };
  const saveOv = (key, k, val) => {
    const m = readMap(key);
    if (val === '' || !isFinite(Number(val))) delete m[k]; else m[k] = Number(val);
    localStorage.setItem(key, JSON.stringify(m));
    render();
  };
  document.querySelectorAll('.vidov').forEach(i => { i.onchange = () => saveOv('tugc_vidov', i.dataset.k, i.value); });
  document.querySelectorAll('.costov').forEach(i => { i.onchange = () => saveOv('tugc_costov', i.dataset.k, i.value); });
  document.querySelectorAll('.paychk').forEach(cb => {
    cb.onchange = () => {
      const k = cb.dataset.k;
      let list = [];
      try { list = JSON.parse(localStorage.getItem('tugc_nocost') || '[]'); } catch(e) { list = []; }
      if (cb.checked) list = list.filter(x => x !== k);
      else if (!list.includes(k)) list.push(k);
      localStorage.setItem('tugc_nocost', JSON.stringify(list));
      // an explicit cost override would mask the tick, so clear it
      const m = readMap('tugc_costov'); delete m[k];
      localStorage.setItem('tugc_costov', JSON.stringify(m));
      render();
    };
  });
}

function renderWeek(){
  const since = Date.now() - 7*86400000;
  const inWk = r => { const d = new Date(r.logged_at || r.created_at); return !isNaN(d) && d.getTime() >= since; };
  const u = (DATA.ugc_income||[]).filter(inWk), a = (DATA.ascension_income||[]).filter(inWk), s = (DATA.side_income||[]).filter(inWk);
  const p = (DATA.payroll||[]).filter(inWk), e = (DATA.expenses||[]).filter(inWk);
  const v = (DATA.videos||[]).filter(inWk);
  const rev = sum(u)+sum(a)+sum(s), out = sum(p)+sum(e);
  const outstanding = (DATA.invoices||[]).filter(i => i.status === 'outstanding');

  const byEditor = {};
  v.forEach(x => { const n = x.editor_name || 'Unknown'; byEditor[n] = (byEditor[n]||0)+1; });
  const edLines = Object.entries(byEditor).sort((x,y)=>y[1]-x[1]);

  $('tab-week').innerHTML = `
    <div class="card">
      <div class="cardtitle">Last 7 days</div>
      <div class="cardsub">A rolling snapshot, independent of the period selector above.</div>
      <table><tbody>
        <tr><td>Revenue in</td><td class="num pos">${money(rev)}</td></tr>
        <tr><td>TraceUGC</td><td class="num">${money(sum(u))}</td></tr>
        <tr><td>Ascension</td><td class="num">${money(sum(a))}</td></tr>
        <tr><td>Side jobs</td><td class="num">${money(sum(s))}</td></tr>
        <tr><td>Paid to editors</td><td class="num neg">−${money(sum(p))}</td></tr>
        <tr><td>Expenses</td><td class="num neg">−${money(sum(e))}</td></tr>
        <tr><td><b>Net</b></td><td class="num ${rev-out>=0?'pos':'neg'}"><b>${money(rev-out)}</b></td></tr>
      </tbody></table>
    </div>
    <div class="card">
      <div class="cardtitle">Output</div>
      <div class="cardsub">${v.length} video${v.length===1?'':'s'} logged in the last 7 days.</div>
      ${edLines.length ? `<table><tbody>${edLines.map(([n,c])=>`<tr><td>${esc(n)}</td><td class="num">${c}</td></tr>`).join('')}</tbody></table>` : `<div class="empty">No videos logged this week.</div>`}
    </div>
    <div class="card">
      <div class="cardtitle">Owed to you</div>
      <div class="cardsub">Invoices still marked outstanding.</div>
      ${outstanding.length ? `<table><tbody>${outstanding.map(i=>`<tr><td>${esc(i.client||'—')}</td><td class="num">${money(i.amount)}</td></tr>`).join('')}
        <tr><td><b>Total</b></td><td class="num"><b>${money(sum(outstanding))}</b></td></tr></tbody></table>` : `<div class="empty">Nothing outstanding.</div>`}
    </div>`;
}

function renderPayroll(pay){
  let ugc=0, asc=0, un=0;
  pay.forEach(r => { const s = split(r); ugc+=s.ugc; asc+=s.asc; un+=s.untagged; });
  const byEditor = {};
  pay.forEach(r => {
    const n = r.editor_name || 'Unknown';
    if(!byEditor[n]) byEditor[n] = { amt:0, vids:0 };
    byEditor[n].amt += Number(r.amount)||0;
    byEditor[n].vids += Number(r.videos)||0;
  });
  const rows = Object.entries(byEditor).sort((a,b)=>b[1].amt-a[1].amt);
  $('tab-payroll').innerHTML = `
    <div class="card">
      <div class="cardtitle">By business</div>
      <div class="cardsub">Payments covering both businesses are split by video count.</div>
      <table><tbody>
        <tr><td>TraceUGC</td><td class="num">${money(ugc)}</td></tr>
        <tr><td>Ascension Media</td><td class="num">${money(asc)}</td></tr>
        ${un ? `<tr><td>Untagged<div class="cardsub" style="margin:4px 0 0">Tag these with <span class="mono">/payroll edit</span> in Discord to split them.</div></td><td class="num">${money(un)}</td></tr>` : ''}
      </tbody></table>
    </div>
    <div class="card">
      <div class="cardtitle">By editor</div>
      <div class="cardsub">Total paid in the selected period.</div>
      ${rows.length ? `<table><thead><tr><th>Editor</th><th class="num">Videos</th><th class="num">Paid</th></tr></thead><tbody>
        ${rows.map(([n,d])=>`<tr><td>${esc(n)}</td><td class="num">${d.vids}</td><td class="num">${money(d.amt)}</td></tr>`).join('')}
      </tbody></table>` : `<div class="empty">No payroll in this period.</div>`}
    </div>`;
}

function renderExpenses(exp){
  const byBiz = {}, byCat = {};
  exp.forEach(r => {
    byBiz[r.business||'Other'] = (byBiz[r.business||'Other']||0) + (Number(r.amount)||0);
    const c = r.category || 'Uncategorised';
    byCat[c] = (byCat[c]||0) + (Number(r.amount)||0);
  });
  const b = Object.entries(byBiz).sort((x,y)=>y[1]-x[1]);
  const c = Object.entries(byCat).sort((x,y)=>y[1]-x[1]);
  $('tab-expenses').innerHTML = `
    <div class="card">
      <div class="cardtitle">By business</div>
      <div class="cardsub">Everything logged with <span class="mono">/expense</span>.</div>
      ${b.length ? `<table><tbody>${b.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${money(v)}</td></tr>`).join('')}</tbody></table>` : `<div class="empty">No expenses in this period.</div>`}
    </div>
    ${c.length ? `<div class="card"><div class="cardtitle">By category</div><div class="cardsub">Where the money goes.</div>
      <table><tbody>${c.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${money(v)}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
}

function renderInvoices(){
  const all = (DATA.invoices||[]).slice().sort((a,b)=> new Date(b.created_at||0) - new Date(a.created_at||0));
  const outs = all.filter(i => i.status === 'outstanding');
  $('tab-invoices').innerHTML = `
    <div class="card">
      <div class="cardtitle">Outstanding</div>
      <div class="cardsub">${outs.length} unpaid · ${money(sum(outs))} owed.</div>
      ${all.length ? `<table><thead><tr><th>ID</th><th>From</th><th>For</th><th>Status</th><th class="num">Amount</th></tr></thead><tbody>
        ${all.map(i=>`<tr><td class="mono">${esc(i.id||'')}</td><td>${esc(i.client||'—')}</td><td style="color:var(--mut)">${esc(i.description||'')}</td>
          <td><span class="tag" style="${i.status==='paid'?'color:var(--pos);border-color:var(--pos)':'color:var(--master);border-color:var(--master)'}">${esc(i.status||'—')}</span></td>
          <td class="num">${money(i.amount)}</td></tr>`).join('')}
      </tbody></table>` : `<div class="empty">No invoices yet.</div>`}
    </div>`;
}

function renderMrr(total){
  const rows = (DATA.mrr_clients||[]).slice().sort((a,b)=>b.amount-a.amount);
  $('tab-mrr').innerHTML = `
    <div class="card">
      <div class="cardtitle">Ascension recurring</div>
      <div class="cardsub">${money(total)} per month · ${money(total*12)} annualised.</div>
      ${rows.length ? `<table><thead><tr><th>Client</th><th class="num">Monthly</th><th class="num">Annual</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${esc(r.client)}</td><td class="num">${money(r.amount)}</td><td class="num" style="color:var(--mut)">${money(r.amount*12)}</td></tr>`).join('')}
      </tbody></table>` : `<div class="empty">No recurring clients yet. Add them with <span class="mono">/mrr add</span> in Discord.</div>`}
    </div>`;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
</script>
</body>
</html>
